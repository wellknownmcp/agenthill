# AgentHill — two hosts, one VPS.
#   agenthill.lol      → the page (Next, :3304), except the machine surfaces
#   mcp.agenthill.lol  → the server (:3303)
#
# Cloudflare is in front (Full strict): the origin certificate lives in
# /etc/ssl/agenthill/. Real client IP comes from CF-Connecting-IP.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name agenthill.lol www.agenthill.lol mcp.agenthill.lol;
    return 301 https://$host$request_uri;
}

# ── The page ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name agenthill.lol;

    ssl_certificate     /etc/ssl/agenthill/origin.pem;
    ssl_certificate_key /etc/ssl/agenthill/origin.key;

    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/plain text/markdown application/json application/javascript text/css;

    # Machine surfaces are served by the game server, not by Next: they are
    # generated from the same DaySnapshot as the page (§7 bis).
    location /api/            { proxy_pass http://127.0.0.1:3303; include /etc/nginx/snippets/agenthill-proxy.conf; }
    location /llms.txt        { proxy_pass http://127.0.0.1:3303; include /etc/nginx/snippets/agenthill-proxy.conf; }
    location /llms-full.txt   { proxy_pass http://127.0.0.1:3303; include /etc/nginx/snippets/agenthill-proxy.conf; }
    location /.well-known/    { proxy_pass http://127.0.0.1:3303; include /etc/nginx/snippets/agenthill-proxy.conf; }
    location /stripe/webhook  { proxy_pass http://127.0.0.1:3303; include /etc/nginx/snippets/agenthill-proxy.conf; }

    # Internal endpoints are never reachable from outside.
    location /internal/ { return 404; }
    location /admin/    { return 404; }

    location / { proxy_pass http://127.0.0.1:3304; include /etc/nginx/snippets/agenthill-proxy.conf; }
}

# ── The MCP server ──────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name mcp.agenthill.lol;

    ssl_certificate     /etc/ssl/agenthill/origin.pem;
    ssl_certificate_key /etc/ssl/agenthill/origin.key;

    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;

    client_max_body_size 1m;

    location /internal/ { return 404; }

    # The bell only from the machine itself (crontab hits 127.0.0.1 directly).
    location /admin/ { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:3303; include /etc/nginx/snippets/agenthill-proxy.conf; }

    location / {
        proxy_pass http://127.0.0.1:3303;
        include /etc/nginx/snippets/agenthill-proxy.conf;
        # Streamable HTTP: no buffering, long-lived responses.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
