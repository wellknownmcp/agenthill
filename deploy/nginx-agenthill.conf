# AgentHill - one VPS, two hosts.
#   agenthill.lol      -> the page (Next, :3304), except the machine surfaces
#   mcp.agenthill.lol  -> the game server (:3303)
#
# Written to work BOTH ways: served directly today, and behind Cloudflare after
# the nameserver switch. The Let's Encrypt certificate is valid in both modes,
# unlike a Cloudflare origin certificate.
#
# CF-Connecting-IP is trusted ONLY from Cloudflare's published ranges. Trusting
# it from anywhere would let a visitor forge their own address and poison the
# view counters, which are meant to be the honest part of this product.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name agenthill.lol www.agenthill.lol mcp.agenthill.lol;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name www.agenthill.lol;
    ssl_certificate     /etc/letsencrypt/live/agenthill.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agenthill.lol/privkey.pem;
    return 301 https://agenthill.lol$request_uri;
}

# -- The page ---------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name agenthill.lol;

    ssl_certificate     /etc/letsencrypt/live/agenthill.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agenthill.lol/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Short while the domain is settling. Raise to a year once the switch to
    # Cloudflare is done and stable: a long max-age on a moving target locks
    # visitors out of a site you can no longer serve.
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/plain text/markdown application/json application/javascript text/css application/linkset+json;

    # Machine surfaces come from the game server: they are generated from the
    # same DaySnapshot as the page, and must never diverge from it.
    location /api/           { proxy_pass http://127.0.0.1:3303; include snippets/agenthill-proxy.conf; }
    location /llms.txt       { proxy_pass http://127.0.0.1:3303; include snippets/agenthill-proxy.conf; }
    location /llms-full.txt  { proxy_pass http://127.0.0.1:3303; include snippets/agenthill-proxy.conf; }
    location /openapi.json   { proxy_pass http://127.0.0.1:3303; include snippets/agenthill-proxy.conf; }
    location /.well-known/   { proxy_pass http://127.0.0.1:3303; include snippets/agenthill-proxy.conf; }
    location /stripe/webhook { proxy_pass http://127.0.0.1:3303; include snippets/agenthill-proxy.conf; }
    location ~ \.md$         { proxy_pass http://127.0.0.1:3303; include snippets/agenthill-proxy.conf; }

    # Never reachable from outside.
    location /internal/ { return 404; }
    location /admin/    { return 404; }

    location / { proxy_pass http://127.0.0.1:3304; include snippets/agenthill-proxy.conf; }
}

# -- The MCP server ---------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name mcp.agenthill.lol;

    ssl_certificate     /etc/letsencrypt/live/agenthill.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agenthill.lol/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=300" always;
    client_max_body_size 1m;

    location /internal/ { return 404; }
    # The bell rings from the machine itself; the crontab calls 127.0.0.1 directly.
    location /admin/ { deny all; }

    location / {
        proxy_pass http://127.0.0.1:3303;
        include snippets/agenthill-proxy.conf;
        # Streamable HTTP: no buffering, long-lived responses.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
